name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # A workflow change reruns both apps, so CI fixes get tested and deployed
            backend:
              - 'backend/**'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/**'

  backend-test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    # No database here: Surefire only runs unit/** tests, which never start Spring.
    # Add a postgres service back if integration tests are ever run in CI.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run tests
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw test

      - name: Package application
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-app
          path: backend/target/*.jar

  backend-push:
    needs: backend-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-app
          path: backend/target

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        working-directory: backend
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/suivi-mns-back:${{ github.sha }} .
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/suivi-mns-back:latest .

      - name: Push image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/suivi-mns-back:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/suivi-mns-back:latest

  frontend-test:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  frontend-push:
    needs: frontend-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build the Docker images
        working-directory: frontend
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/suivi-mns-front:latest .
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/suivi-mns-front:${{ github.sha }} .

      - name: Push the Docker images
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/suivi-mns-front:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/suivi-mns-front:${{ github.sha }}

  deploy:
    needs: [ backend-push, frontend-push ]
    if: always() && github.event_name == 'push' && (needs.backend-push.result == 'success' || needs.frontend-push.result == 'success')
    # The VPS is reachable over SSH from the internet, so a GitHub-hosted runner is enough
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker compose
        uses: garygrossgarten/github-action-scp@release
        with:
          local: backend/compose.yml
          remote: /opt/suivi_mns/compose.yml
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          privateKey: ${{ secrets.SERVER_SSH_KEY }}

      - name: Deploy on server
        uses: garygrossgarten/github-action-ssh@release
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          privateKey: ${{ secrets.SERVER_SSH_KEY }}
          command: |
            echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
            cd /opt/suivi_mns
            docker compose pull
            docker compose up -d --remove-orphans
            # Every deploy pulls new images: drop the old ones so the disk doesn't fill up
            docker image prune -f

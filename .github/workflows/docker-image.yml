name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Extract package name and version
      id: package-info
      run: echo "VERSION=$(jq -r '.version' package.json)" >> $GITHUB_ENV

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build the Docker images
      run: |
        docker build -t  ${{ secrets.DOCKER_USERNAME }}/suivi-mns-front:latest . -t  ${{ secrets.DOCKER_USERNAME }}/suivi-mns-front:${{ github.sha }} . 
        
    - name: Push the Docker images
      run: |
        docker push  ${{ secrets.DOCKER_USERNAME }}/suivi-mns-front:latest
        docker push  ${{ secrets.DOCKER_USERNAME }}/suivi-mns-front:${{ github.sha }}

services:
  postgres:
    image: postgres:18
    container_name: postgres_container_suivi
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER}" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    image: bchamplon/suivi-mns-back:latest
    env_file:
      - .env
    depends_on:
      - postgres
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      # The JRE Alpine image has no curl; busybox wget exits non-zero on HTTP errors
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  front:
    image: bchamplon/suivi-mns-front:latest
    networks:
      - backend
    restart: unless-stopped

  # Single entry point: gets and renews the Let's Encrypt certificates and
  # routes each domain to its container. Another site on this host (e.g. a
  # portfolio on the root domain) only needs a new block in the Caddyfile below.
  caddy:
    image: caddy:2.10-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - /var/log/caddy:/var/log/caddy
    depends_on:
      - front
    networks:
      - backend
    restart: unless-stopped

# Inline so the CI deploy job only has to copy this file to the server
configs:
  caddyfile:
    content: |
      yorksoft.benoitchamplon.fr {
        reverse_proxy front:80
        # Access logs with the visitor IP, kept 14 days (announced on the legal notice page).
        # Rotation is done by logrotate on the host (docs/SERVER_SETUP.md), so Caddy's own is off.
        log {
          output file /var/log/caddy/access.log {
            roll_disabled
          }
          format json
        }
      }

volumes:
  postgres_data:
  # Certificates: keep them across restarts to stay under Let's Encrypt rate limits
  caddy_data:
  caddy_config:

networks:
  backend:
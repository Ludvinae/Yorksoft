spring.datasource.url=jdbc:postgresql://localhost:5432/db
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=create

spring.sql.init.platform=init
spring.sql.init.mode=always

jwt.secret=blunder

# Local front (ng serve) calls the API directly on :8080
app.cors.allowed-origins=http://localhost:4200

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# Replace data-init password values with hashed versions
app.seed.demo-admin-password=AdminPass1
app.seed.demo-technician-password=TechnicianPass1
app.seed.demo-director-password=DirectorPass1
app.seed.demo-manager-password=ManagerPass1
app.seed.demo-client-password=ClientPass1

# Public demo (trial technician accounts) enabled locally to try it
app.demo.enabled=true

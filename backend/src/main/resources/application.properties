
spring.application.name=SuiviMNS

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto = ${DDL_AUTO}
spring.jpa.show-sql=true

spring.sql.init.platform = ${SQL_FILE}

spring.sql.init.mode = ${SQL_INIT_MODE}

springdoc.api-docs.path=/api-docs

spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.jakarta.persistence.validation.mode=none

jwt.secret=${JWT_SECRET}

# Replace data-init placeholder passwords with hashed versions (no-op if unset or already hashed)
app.seed.demo-admin-password=${APP_SEED_DEMO_ADMIN_PASSWORD:}
app.seed.demo-technician-password=${APP_SEED_DEMO_TECHNICIAN_PASSWORD:}
app.seed.demo-director-password=${APP_SEED_DEMO_DIRECTOR_PASSWORD:}
app.seed.demo-manager-password=${APP_SEED_DEMO_MANAGER_PASSWORD:}
app.seed.demo-client-password=${APP_SEED_DEMO_CLIENT_PASSWORD:}

#spring.datasource.hikari.connection-timeout=10000
#spring.datasource.hikari.initialization-fail-timeout=20000

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
# Behind Caddy, which terminates HTTPS: pass on its scheme instead of nginx's own (http)
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name yorksoft.benoitchamplon.fr;

    # Visitor IPs are logged once, by Caddy, with a 14-day retention (legal notice page);
    # Docker would keep these logs by size, with no time limit
    access_log off;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html names the current build's bundles: browsers must revalidate it on every visit
    # (cheap thanks to the ETag), or they keep running an old build after a deploy.
    # The SPA fallback above lands here too.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Angular puts a content hash in every bundle name, so a given URL never changes content
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://app:8080/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}

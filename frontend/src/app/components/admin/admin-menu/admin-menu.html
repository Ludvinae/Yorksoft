<div class="flex flex-col sm:flex-row flex-wrap gap-8 m-4">
  @for (group of groups; track group.title) {
    <div>
      <h3 class="text-lg font-semibold mb-4">{{ group.title }}</h3>

      <!-- Buttons must be direct children of .join for its rounded first/last corners -->
      <div class="join join-vertical">
        @for (item of group.items; track item.link) {
          <a class="btn join-item w-52" [routerLink]="item.link">
            {{ item.label }}
          </a>
        }
      </div>
    </div>
  }
</div>

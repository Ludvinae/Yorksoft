@if (dashboard(); as dashboard) {
  <div class="grid lg:grid-cols-12 gap-4">
    <div class="col-span-9">
      <!-- KPI SECTION -->
      <!-- Cards with a null value are KPIs not implemented yet (rendered as "-") -->
      <div class="card bg-base-100">
        <div class="card-body p-4 gap-4">

          <h2 class="text-2xl font-bold text-center">
            Santé des données
          </h2>

          <!-- TICKETS -->
          <h3 class="text-lg font-bold">Tickets</h3>

          <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">

            <app-kpi-card
              title="Fermés sans date de fin"
              [value]="dashboard.ticketHealth.closedWithoutEndDate"
              icon="ph ph-warning"
              colorClass="text-error"
              [filters]="{ statuses: ['CLOSED'], isNotClosed: true }"
            />

            <app-kpi-card
              title="Ouverts avec date de clôture"
              [value]="dashboard.ticketHealth.openWithCloseDate"
              icon="ph ph-calendar-x"
              colorClass="text-error"
              [filters]="{
                statuses: ['OPEN', 'ASSIGNED', 'IN_PROGRESS', 'WAITING_CLIENT', 'WAITING_THIRD_PARTY', 'SOLVED'],
                isNotClosed: false
              }"
            />

            <app-kpi-card
              title="Statut désynchronisé"
              [value]="dashboard.ticketHealth.statusMismatch"
              icon="ph ph-arrows-clockwise"
              colorClass="text-error"
              [filters]="{ hasStatusMismatch: true }"
            />

            <app-kpi-card
              title="Affectations incohérentes"
              [value]="dashboard.ticketHealth.assignmentIssues"
              icon="ph ph-user-switch"
              colorClass="text-error"
              [filters]="{ hasAssignmentIssue: true }"
            />

            <app-kpi-card
              title="SLA dépassé non signalé"
              [value]="dashboard.ticketHealth.unflaggedSlaBreaches"
              icon="ph ph-alarm"
              colorClass="text-warning"
              [filters]="{ hasUnflaggedSlaBreach: true }"
            />

            <app-kpi-card
              title="Sans client ou version"
              [value]="null"
              icon="ph ph-link-break"
              colorClass="text-warning"
            />

          </div>

          <!-- UTILISATEURS -->
          <h3 class="text-lg font-bold">Utilisateurs</h3>

          <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">

            <app-kpi-card
              title="Sans rôle"
              [value]="null"
              icon="ph ph-user-circle-dashed"
              colorClass="text-error"
            />

            <app-kpi-card
              title="Rôles multiples"
              [value]="null"
              icon="ph ph-users-three"
              colorClass="text-error"
            />

            <app-kpi-card
              title="Mot de passe non initialisé"
              [value]="null"
              icon="ph ph-key"
              colorClass="text-error"
            />

            <app-kpi-card
              title="Inactifs depuis 90 jours"
              [value]="null"
              icon="ph ph-clock-countdown"
              colorClass="text-warning"
            />

            <app-kpi-card
              title="Jamais actifs"
              [value]="null"
              icon="ph ph-user-minus"
              colorClass="text-warning"
            />

            <app-kpi-card
              title="Comptes admin"
              [value]="null"
              icon="ph ph-shield-check"
            />

          </div>

        </div>
      </div>

      <!-- CHARTS -->
      <div class="card bg-base-100">
        <div class="card-body">

          <h2 class="text-3xl font-bold text-center mb-6">
            Graphiques
          </h2>

          <div class="grid grid-cols-1 2xl:grid-cols-2 gap-6">

            <!-- EVOLUTION -->
            <div class="card border border-base-300">
              <div class="card-body">

                <h3 class="card-title justify-center">
                  Evolution des tickets
                </h3>

                <div class="h-80 flex items-center justify-center">
                  <!-- ngx charts / chart.js -->
                  <p class="opacity-50">
                    Graphique évolution
                  </p>
                </div>

              </div>
            </div>

            <!-- PIE -->
            <div class="card border border-base-300">
              <div class="card-body">

                <h3 class="card-title justify-center">
                  Répartition par statut
                </h3>

                <div class="h-80 flex items-center justify-center">

                </div>

              </div>
            </div>

            <!-- LOGICIEL -->
            <div class="card border border-base-300">
              <div class="card-body">

                <h3 class="card-title justify-center">
                  Répartition par logiciel
                </h3>

                <div class="h-80 flex items-center justify-center">
                  <p class="opacity-50">
                    Bar chart logiciels
                  </p>
                </div>

              </div>
            </div>

            <!-- THEMATIQUE -->
            <div class="card border border-base-300">
              <div class="card-body">

                <h3 class="card-title justify-center">
                  Répartition par thématique
                </h3>

                <div class="h-80 flex items-center justify-center">
                  <p class="opacity-50">
                    Graphique thématiques
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- ACTIVITY FEED -->
    <div class="card bg-base-100 col-span-3">
      <app-activity-feed [activities]="dashboard.activities"></app-activity-feed>
    </div>
  </div>
}

<!-- dashboard-kpi-card.component.html -->
<!-- .card stacks its children in a column: keep them stretched (not items-center) so the title gets the card width and truncates -->

<div class="group flex justify-between items-stretch text-center gap-4 p-2 card border border-base-300"
  [class]="filters ? 'transition-all duration-200 hover:bg-base-200 hover:shadow-md cursor-pointer' : ''"
  (click)="navigateToTickets()">

  <div class="flex flex-col min-w-0">
    <span class="text-sm opacity-70 truncate" [title]="title">
      {{ title }}
    </span>

    <span class="text-2xl font-black" [class]="colorClass">
      @if (value != null) {
        {{ value }}{{ suffix }}
      } @else {
        -
      }
    </span>
  </div>

  @if (icon) {
    <div class="text-4xl opacity-70 transition-transform"
      [class]="filters ? 'group-hover:scale-110' : ''">
      <i [class]="icon"></i>
    </div>
  }

</div>

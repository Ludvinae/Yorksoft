@if (isEmpty()) {
  <p class="h-80 flex items-center justify-center opacity-60">Aucun ticket actif</p>
} @else {
  <div class="h-80">
    <canvas baseChart type="bar" [data]="chartData()" [options]="chartOptions"></canvas>
  </div>

  <details class="mt-2 text-sm">
    <summary class="cursor-pointer opacity-70">Voir les données</summary>
    <table class="table table-xs mt-2">
      <thead>
        <tr>
          <th>Âge depuis l'ouverture</th>
          <th class="text-right">Tickets</th>
        </tr>
      </thead>
      <tbody>
        @for (row of rows(); track row.label) {
          <tr>
            <td>{{ row.label }}</td>
            <td class="text-right tabular-nums">{{ row.count }}</td>
          </tr>
        }
      </tbody>
    </table>
  </details>
}

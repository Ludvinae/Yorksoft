@if (isEmpty()) {
  <p class="h-80 flex items-center justify-center opacity-60">Aucun ticket pris en charge ou clos sur la période</p>
} @else {
  <div class="h-80">
    <canvas baseChart type="line" [data]="chartData()" [options]="chartOptions" [plugins]="plugins"></canvas>
  </div>

  <details class="mt-2 text-sm">
    <summary class="cursor-pointer opacity-70">Voir les données</summary>
    <div class="max-h-60 overflow-y-auto mt-2">
      <table class="table table-xs">
        <thead>
          <tr>
            <th>{{ unit() === 'week' ? 'Semaine' : 'Jour' }}</th>
            <th class="text-right">Pris en charge</th>
            <th class="text-right">Clos</th>
          </tr>
        </thead>
        <tbody>
          @for (point of points(); track point.date; let i = $index) {
            <tr>
              <td>{{ labels()[i] }}</td>
              <td class="text-right tabular-nums">{{ point.takenInCharge }}</td>
              <td class="text-right tabular-nums">{{ point.closed }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </details>
}

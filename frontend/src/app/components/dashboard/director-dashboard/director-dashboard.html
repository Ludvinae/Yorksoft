@if (dashboard(); as dashboard) {
  <div class="grid lg:grid-cols-12 gap-4">
    <div class="col-span-9">
      <!-- KPI SECTION -->
      <div class="card bg-base-100">
        <div class="card-body gap-6">

          <h2 class="text-3xl font-bold text-center">
            Indicateurs de performance
          </h2>

          <div class="grid grid-cols-1 xl:grid-cols-2 gap-4">

            <!-- TICKETS -->
            <div class="card border border-base-300 bg-base-100">
              <div class="card-body p-4">

                <h3 class="text-2xl font-bold text-center mb-4">
                  Tickets
                </h3>

                <div class="grid grid-cols-1 sm:grid-cols-3 sm:divide-x divide-y border rounded-xl overflow-hidden">



                </div>
              </div>
            </div>

            <!-- TEMPS -->
            <div class="card border border-base-300 bg-base-100">
              <div class="card-body p-4">

                <h3 class="text-2xl font-bold text-center mb-4">
                  Temps moyen
                </h3>

                <div class="grid grid-cols-1 sm:grid-cols-3 sm:divide-x divide-y border rounded-xl overflow-hidden">

                  <app-kpi-card
                    title="Résolution"
                    value="80m"
                    icon="ph ph-check-circle"
                  />

                  <app-kpi-card
                    title="Prise en charge"
                    value="40m"
                    icon="ph ph-hand-pointing"
                  />

                  <app-kpi-card
                    title="Appels"
                    value="214s"
                    icon="ph ph-phone"
                  />

                  <app-kpi-card
                    title="Par technicien"
                    value="12.6"
                    icon="ph ph-users"
                  />

                  <app-kpi-card
                    title="Résolus / jour"
                    value="14"
                    icon="ph ph-calendar-dot"
                  />

                  <app-kpi-card
                    title="Clos / semaine"
                    value="122"
                    icon="ph ph-calendar-dots"
                  />

                </div>
              </div>
            </div>

          </div>

        </div>
      </div>

      <!-- CHARTS -->
      <div class="card bg-base-100">
        <div class="card-body">

          <h2 class="text-3xl font-bold text-center mb-6">
            Graphiques
          </h2>

          <div class="grid grid-cols-1 2xl:grid-cols-2 gap-6">

            <!-- EVOLUTION -->
            <div class="card border border-base-300">
              <div class="card-body">

                <h3 class="card-title justify-center">
                  Evolution des tickets
                </h3>

                <div class="h-80 flex items-center justify-center">
                  <!-- ngx charts / chart.js -->
                  <p class="opacity-50">
                    Graphique évolution
                  </p>
                </div>

              </div>
            </div>

            <!-- PIE -->
            <div class="card border border-base-300">
              <div class="card-body">

                <h3 class="card-title justify-center">
                  Répartition par statut
                </h3>

                <div class="h-80 flex items-center justify-center">

                </div>

              </div>
            </div>

            <!-- LOGICIEL -->
            <div class="card border border-base-300">
              <div class="card-body">

                <h3 class="card-title justify-center">
                  Répartition par logiciel
                </h3>

                <div class="h-80 flex items-center justify-center">
                  <p class="opacity-50">
                    Bar chart logiciels
                  </p>
                </div>

              </div>
            </div>

            <!-- THEMATIQUE -->
            <div class="card border border-base-300">
              <div class="card-body">

                <h3 class="card-title justify-center">
                  Répartition par thématique
                </h3>

                <div class="h-80 flex items-center justify-center">
                  <p class="opacity-50">
                    Graphique thématiques
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- ACTIVITY FEED -->
    <div class="card bg-base-100 col-span-3">
      <app-activity-feed [activities]="dashboard.activities"></app-activity-feed>
    </div>
  </div>
}

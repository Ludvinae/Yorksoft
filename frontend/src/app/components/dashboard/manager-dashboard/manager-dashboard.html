  @if (dashboard(); as dashboard) {
    <div class="grid lg:grid-cols-12 gap-4">
      <div class="col-span-9">
      <!-- KPI SECTION -->
      <div class="card bg-base-100">
        <div class="card-body p-4 gap-4">

          <h2 class="text-2xl font-bold text-center">
            Indicateurs de performance
          </h2>

          <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">

            <!-- OUVERTS -->
            <app-kpi-card
              title="Ouverts"
              [value]="dashboard.openTickets"
              icon="ph ph-book-open"
              colorClass="text-warning"
              (cardClick)="ticketStore.openList({ statusesExcluded: ['CLOSED'] })"
            />

            <!-- EN COURS -->
            <app-kpi-card
              title="En cours"
              [value]="dashboard.inProgressTickets"
              icon="ph ph-package"
              colorClass="text-success"
              (cardClick)="ticketStore.openList({ statuses: ['IN_PROGRESS'] })"
            />

            <!-- EN ATTENTE -->
            <app-kpi-card
              title="En attente"
              [value]="dashboard.waitingTickets"
              icon="ph ph-hourglass"
              colorClass="text-info"
              (cardClick)="ticketStore.openList({ statuses: ['WAITING_CLIENT', 'WAITING_THIRD_PARTY'] })"
            />

            <!-- PRIORITAIRES -->
            <app-kpi-card
              title="Prioritaires"
              [value]="dashboard.priorityTickets"
              icon="ph ph-fast-forward"
              colorClass="text-error"
              (cardClick)="ticketStore.openList({ priorityGreaterThan: 65 })"
            />

            <!-- EN RETARD -->
            <app-kpi-card
              title="En retard"
              [value]="dashboard.overdueTickets"
              icon="ph ph-alarm"
              colorClass="text-error"
              (cardClick)="ticketStore.openList({ isOverdue: true, isNotClosed: true })"
            />

            <!-- NON ASSIGNES -->
            <app-kpi-card
              title="Non assignés"
              [value]="dashboard.unassignedTickets"
              icon="ph ph-folder-user"
              colorClass="text-warning"
              (cardClick)="ticketStore.openList({ statuses: ['OPEN'] })"
            />

            <!-- TEMPS RESOLUTION -->
            <app-kpi-card
              title="Résolution"
              [value]="dashboard.averageResolutionTime / 60 | number: '1.0-0'"
              suffix="m"
              icon="ph ph-check-circle"
            />

            <!-- TEMPS PRISE EN CHARGE -->
            <app-kpi-card
              title="Prise en charge"
              [value]="dashboard.averageResponseTime / 60 | number: '1.0-0'"
              suffix="m"
              icon="ph ph-hand-pointing"
            />

            <!-- TEMPS APPEL -->
            <app-kpi-card
              title="Appels"
              [value]="dashboard.averageCallDuration | number: '1.0-0'"
              suffix="m"
              icon="ph ph-phone"
            />

            <!-- PAR TECHNICIEN -->
            <app-kpi-card
              title="Par technicien"
              [value]="dashboard.ticketPerTechnician | number: '1.0-1'"
              icon="ph ph-users"
            />

            <!-- CLOS / JOUR -->
            <app-kpi-card
              title="Clos / jour"
              [value]="dashboard.closedPerDay | number: '1.0-2'"
              icon="ph ph-calendar-dot"
            />

            <!-- CLOS / SEMAINE -->
            <app-kpi-card
              title="Clos / semaine"
              [value]="dashboard.closedPerWeek | number: '1.0-2'"
              icon="ph ph-calendar-dots"
            />

          </div>
        </div>
      </div>

      <!-- CHARTS -->
      <div class="card bg-base-100 mt-4">
        <div class="card-body p-4">

          <h2 class="text-2xl font-bold text-center mb-4">
            Graphiques
          </h2>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">

            <!-- CHARGE TECHNICIENS -->
            <div class="card border border-base-300">
              <div class="card-body p-4">

                <h3 class="card-title justify-center text-lg">
                  Charge de travail
                </h3>

                <div class="h-64 xl:h-72 flex items-center justify-center">
                  <app-technician-workload-chart
                    [workloadStats]="dashboard.techniciansWorkload ?? []">
                  </app-technician-workload-chart>
                </div>

              </div>
            </div>

            <!-- STATUT -->
            <div class="card border border-base-300">
              <div class="card-body p-4">

                <h3 class="card-title justify-center text-lg">
                  Répartition par statut
                </h3>

                <div class="h-64 xl:h-72 flex items-center justify-center">
                  <app-ticket-status-pie-chart
                    [stats]="dashboard.ticketsByStatus ?? []">
                  </app-ticket-status-pie-chart>
                </div>

              </div>
            </div>

            <!-- LOGICIEL -->
            <div class="card border border-base-300">
              <div class="card-body p-4">

                <h3 class="card-title justify-center text-lg">
                  Répartition par logiciel
                </h3>

                <div class="h-64 xl:h-72 flex items-center justify-center">
                  <app-ticket-software-chart
                    [softwareStats]="dashboard.ticketsBySoftware ?? []">
                  </app-ticket-software-chart>
                </div>

              </div>
            </div>

            <!-- THEME -->
            <div class="card border border-base-300">
              <div class="card-body p-4">

                <h3 class="card-title justify-center text-lg">
                  Répartition par thématique
                </h3>

                <div class="h-64 xl:h-72 flex items-center justify-center">
                  <app-ticket-theme-chart
                    [themeStats]="dashboard.ticketsByTheme ?? []">
                  </app-ticket-theme-chart>
                </div>

              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
    <!-- ACTIVITY FEED -->
    <div class="card bg-base-100 col-span-3">
      <app-activity-feed [activities]="dashboard.activities"></app-activity-feed>
    </div>
  </div>
}

<app-page-header [title]="title ?? ''">

  <div pageActions>
    <button class="btn btn-sm" [routerLink]="updateRoute">
      Modifier
    </button>
    <button class="btn btn-sm" routerLink="../">
      Retour
    </button>
  </div>

  @if (loading) {
    <div class="flex justify-center items-center h-40">
      <span class="loading loading-spinner loading-lg"></span>
    </div>
  } @else {
    <div class="card bg-base-200 shadow p-6">
      <ng-content></ng-content>
    </div>
  }

  @if (error) {
    <div class="alert alert-error mt-4">{{ error }}</div>
  }

</app-page-header>

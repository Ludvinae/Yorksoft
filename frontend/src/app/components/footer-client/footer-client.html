<div
  class="w-full border-t border-base-300 bg-base-100 px-4 py-3"
>

  <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">

    <!-- Infos pagination -->
    <div class="text-sm text-base-content/70">

      Affichage de
      <span class="font-semibold">
        @if (store.size() < store.totalElements()) {
          {{ store.size() }}
        }
        @else {
          {{ store.totalElements() }}
        }
      </span>

      client(s) sur

      <span class="font-semibold">
        {{ store.totalElements() }}
      </span>

      • Page

      <span class="font-semibold">
        {{ store.page() + 1 }}
      </span>

      /

      <span class="font-semibold">
        {{ store.totalPages() }}
      </span>

    </div>

    <!-- Boutons -->
    <div class="join">

      <button
        class="join-item btn btn-sm"
        [disabled]="store.isFirstPage()"
        (click)="previousPage()"
      >
        ← Précédent
      </button>

      <button
        class="join-item btn btn-sm"
        [disabled]="store.isLastPage()"
        (click)="nextPage()"
      >
        Suivant →
      </button>

    </div>

  </div>

</div>

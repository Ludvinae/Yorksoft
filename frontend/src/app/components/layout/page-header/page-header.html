<!-- Height = available viewport height; the app shell lowers --page-height when it adds a header above the page (mobile) -->
<div class="p-6 h-(--page-height,100dvh) flex flex-col">

  <div class="flex flex-wrap items-center justify-between gap-2 mb-6 shrink-0">
    <h1 class="text-3xl font-semibold">{{ title }}</h1>

    <div class="flex items-center gap-2">
      <ng-content select="[pageActions]"></ng-content>
    </div>
  </div>

  <!-- Scrolls internally so the root's p-6 padding is kept on pages taller than the viewport -->
  <div class="flex-1 flex flex-col min-h-0 overflow-y-auto">
    <ng-content></ng-content>
  </div>

</div>

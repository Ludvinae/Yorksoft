<header class="h-screen w-64 bg-base-200 flex flex-col border-r border-base-300">

  <!-- HEADER (logo + notif) -->
  <div class="flex items-center justify-between p-4 border-b border-base-300">
    <div class="flex items-center gap-2">
      <!-- Logo -->
      <div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center text-white font-bold">
        Y
      </div>
      <span class="text-lg font-semibold">YorkSoft</span>
    </div>

    <!-- Notifications -->
    <button class="btn btn-ghost btn-circle">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
           viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002
          6.002 0 00-4-5.659V5a2 2 0 10-4
          0v.341C7.67 6.165 6 8.388 6
          11v3.159c0 .538-.214 1.055-.595
          1.436L4 17h5m6 0v1a3 3 0
          11-6 0v-1m6 0H9"/>
      </svg>
    </button>
  </div>

  <!-- USER -->
  <div class="p-4 border-b border-base-300">
    <div class="flex items-center gap-3">
      <div class="avatar">
        <div class="w-12 rounded-full bg-base-300">
          <img src="https://ui-avatars.com/api/?name={{ auth.jwtInfo()?.name }}" />
        </div>
      </div>

      <div>
        <p class="font-medium">{{ auth.jwtInfo()?.name }}</p>
        <p class="text-sm text-base-content/60">{{ auth.jwtInfo()?.role | titlecase }} {{ auth.jwtInfo()?.rank }}</p>
      </div>
    </div>

    @if (auth.isTrialAccount()) {
      <p class="mt-3 rounded-box bg-warning/15 p-2 text-xs">
        Compte d'essai&nbsp;: les clients, employés et tickets affichés sont fictifs.
      </p>
    }
  </div>

  <!-- NAVIGATION -->
  <app-nav-desktop [router]="router"></app-nav-desktop>

  <!-- ACTION -->
  <div class="p-4 border-t border-base-300 space-y-3 mt-auto">

    <!-- Nouveau ticket -->
    <button
      routerLink="/ticket/create"
      class="btn btn-primary w-full"
    >
      ➕ Nouveau ticket
    </button>

    <!-- Logout -->
    <button
      (click)="logout()"
      class="btn btn-ghost w-full justify-start text-error"
    >
      Se déconnecter
    </button>

  </div>

</header>

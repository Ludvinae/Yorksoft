<app-page-header [title]="title">

  <div pageActions>
    <ng-content select="[pageActions]"></ng-content>
  </div>

  <!-- Search + filters -->
  <div class="flex flex-wrap items-center gap-4 mb-6 shrink-0">

    <!-- Search -->
    <label class="input input-bordered flex items-center gap-2 w-full max-w-xl">

      <input
        type="text"
        class="grow"
        [placeholder]="searchPlaceholder"
        [ngModel]="searchValue"
        (ngModelChange)="onSearch($event)"
      />

      <svg xmlns="http://www.w3.org/2000/svg"
           class="h-5 w-5 opacity-70"
           fill="none"
           viewBox="0 0 24 24"
           stroke="currentColor">

        <path stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 21l-4.35-4.35m0 0
               A7.5 7.5 0 103.5 10.5
               a7.5 7.5 0 0013.15 6.15z"/>
      </svg>

    </label>

    <!-- Filters -->
    <ng-content select="[filters]"></ng-content>

  </div>

  <!-- contenu projeté (tableau, pied de page...) -->
  <ng-content></ng-content>

</app-page-header>

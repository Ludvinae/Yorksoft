<h1 class="text-5xl font-bold">Configuration</h1>
<div>
  <h2>Affichage</h2>
  <div class="@container max-w-lg">
    <h3>Thèmes</h3>
    <div class="flex flex-row justify-around m-4">

      <div >
        <h4 class="m-4">Lumineux</h4>
        <div class="join join-vertical">
          <input
            type="radio"
            name="theme-buttons"
            class="btn theme-controller join-item w-30"
            aria-label="Light"
            value="light"
            (click)="setTheme('light')"/>

            type="radio"
            name="theme-buttons"
            class="btn theme-controller join-item w-30"
            aria-label="Autumn"

            class="btn theme-controller join-item w-30"

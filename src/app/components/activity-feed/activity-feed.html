
<div class="card bg-base-100 shadow">
  <div class="card-body">
    <h2 class="card-title">
      Activité récente
    </h2>

    <div class="space-y-3">

      @for (activity of activities; track activity.idActivity) {

        <div class="flex gap-3 items-start">

          <div class="mt-1">
            <div class="badge badge-primary badge-sm"></div>
          </div>

          <div class="flex-1">

            <p class="text-sm">
              {{ activity.activityDescription }}
            </p>

            <p class="text-xs text-base-content/60">
              {{ activity.activityTimestamp | date:'dd/MM/yyyy HH:mm' }}
            </p>

          </div>

        </div>

      } @empty {

        <div class="alert alert-info">
          <span>Aucune activité récente.</span>
        </div>

      }

    </div>
  </div>
</div>

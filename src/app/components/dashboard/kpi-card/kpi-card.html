<!-- dashboard-kpi-card.component.html -->

<div class="group flex items-center justify-between gap-4 p-4 transition-all duration-200
            hover:bg-base-200 hover:shadow-md cursor-pointer"
  (click)="navigateToTickets()">

  <div class="flex flex-col">
    <span class="text-sm opacity-70">
      {{ title }}
    </span>

    <span class="text-5xl font-black" [class]="colorClass">
      {{ value }}
    </span>
  </div>

  <div class="text-4xl opacity-70 group-hover:scale-110 transition-transform">
    <i [class]="icon"></i>
  </div>

</div>

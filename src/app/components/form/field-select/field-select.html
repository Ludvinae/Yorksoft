
<fieldset class="fieldset">
  <legend class="fieldset-legend">{{ labelKey }}</legend>

  <select class="select" [formControl]="control">
    <option [ngValue]="null" disabled>
      {{ placeholder }}
    </option>
    @if (options) {
      @for (option of options; track getValue(option)) {
        <option [ngValue]="getValue(option)">
          {{ getLabel(option) }}
        </option>
      }
    }
  </select>

  @if (errorMessage) {
    <span class="form-error">{{ errorMessage }}</span>
  }
</fieldset>

<div class="flex flex-col gap-3">
  @for (item of data; track item) {
    <div class="card bg-base-200 p-4 shadow">

      <!-- contenu spécifique -->
      <ng-container
        [ngTemplateOutlet]="itemTemplate"
        [ngTemplateOutletContext]="{ $implicit: item }">
      </ng-container>

      <!-- actions -->
      <div class="flex gap-2 mt-3">
        <button
          class="btn btn-sm"
          [routerLink]="[baseRoute, getId(item)]">
          👁️
        </button>

        <button
          class="btn btn-sm"
          [routerLink]="[baseRoute, 'update', getId(item)]">
          ✏️
        </button>
      </div>

    </div>
  }
</div>

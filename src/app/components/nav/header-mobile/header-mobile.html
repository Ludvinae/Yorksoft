<header class="bg-base-200 border-b border-base-300 grid grid-cols-3 h-28">

  <!-- LEFT (profil) -->
  <div class="flex flex-col items-center justify-center gap-1 p-2 text-center">

    <!-- Avatar carré -->
    <div class="avatar">
      <div class="w-8 h-8 rounded-lg">
        <img src="https://ui-avatars.com/api/?name={{ auth.jwtInfo()?.name }}"  alt=""/>
      </div>
    </div>

    <!-- User info -->
    <div class="leading-tight">
      <p class="text-sm font-medium">{{ auth.jwtInfo()?.name }}</p>
      <p class="text-xs text-base-content/60">{{ auth.jwtInfo()?.role | titlecase }} {{ auth.jwtInfo()?.rank }}</p>
    </div>

  </div>


  <!-- CENTER (titre) -->
  <div class="flex flex-col items-center relative">

    <!-- nom entreprise -->
    <h1 class="text-xl font-bold tracking-wide text-center pt-4">
      YorkSoft
    </h1>

    <!-- notifications -->
    <button class="btn btn-ghost btn-circle absolute bottom-4">
      <span class="text-2xl">🔔</span>
      <span class="absolute top-1 right-1 badge badge-error badge-xs"></span>
    </button>

  </div>


  <!-- RIGHT -->
  <div class="flex flex-col p-2">

    <!-- Burger -->

    <div class="flex justify-end">
      <button (click)="toggleMenu.emit()" class="btn btn-ghost btn-circle text-2xl">
        ☰
      </button>
    </div>


    <!-- date -->
    <div class="mt-auto text-right pb-2">
      <p class="text-xs text-base-content/60">
        {{ today | date:'EEEE d MMMM yyyy' }}
      </p>
    </div>

  </div>

</header>

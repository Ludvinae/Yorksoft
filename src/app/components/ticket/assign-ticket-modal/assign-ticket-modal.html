<dialog
  #assignModal
  class="modal"
>

  <div class="modal-box max-w-2xl">
    <div class="flex flex-row justify-between">
      <h3 class="font-bold text-2xl mb-4">

        @if (ticket?.idTechnician) {
          Réassigner le ticket #{{ ticket?.idTicket }}
        } @else {
          Assigner le ticket #{{ ticket?.idTicket }}
        }

      </h3>
      @if (ticket) {
        <app-badge-priority [priority]="ticket!.currentPriority"/>
      }
    </div>
    @if (loading) {

      <div class="flex justify-center py-10">
        <span class="loading loading-spinner loading-lg"></span>
      </div>

    } @else {

      <div class="flex flex-col gap-3">

        @for (tech of technicians; track tech.idTechnician) {

          <button
            class="btn btn-outline h-auto py-4 justify-between"
            (click)="assignTo(tech)"
          >

            <div class="text-left">

              <div class="font-semibold">
                {{ tech.fullName }} N{{ tech.rank }}
              </div>

            </div>

            <div class="flex gap-2">

              @if (tech.criticalTicketsCount > 0) {

                <div class="badge badge-error">
                  {{ tech.criticalTicketsCount }} critiques
                </div>

              }

              <div
                class="badge"
                [class.badge-success]="tech.activeTicketsCount <= 3"
                [class.badge-warning]="tech.activeTicketsCount > 3 && tech.activeTicketsCount <= 7"
                [class.badge-error]="tech.activeTicketsCount > 7"
              >
                {{ tech.activeTicketsCount }}
              </div>

            </div>

          </button>

        }

      </div>

    }

    <div class="modal-action flex justify-around">

      <form method="dialog">

        <button class="btn items-center">
          Fermer
        </button>

      </form>

    </div>

  </div>

  <form method="dialog" class="modal-backdrop">
    <button>close</button>
  </form>

</dialog>

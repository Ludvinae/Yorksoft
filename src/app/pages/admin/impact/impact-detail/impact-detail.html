
@if (impact()) {
  <app-detail-page [loading]="loading()" [error]="error()" [title]="label()"
                   [updateRoute]="updateRoute">

    <h2 class="text-2xl font-bold">{{ impact()?.designation }}</h2>
    <h3>Facteur de priorité : {{ impact()?.priorityFactor }}</h3>
    <p>{{ impact()?.description }}</p>

  </app-detail-page>

} @else {
  <span class="loading loading-ring loading-xl"></span>
  <span class="loading loading-ring loading-xl"></span>
  <span class="loading loading-ring loading-xl"></span>
}

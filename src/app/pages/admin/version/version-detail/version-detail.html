
@if (version()) {
  <app-detail-page [loading]="loading()" [error]="error()" [title]="label()"
                   [updateRoute]="updateRoute">

    <h2 class="text-2xl font-bold">{{ version()?.versionNumber }} {{ version()?.versionTypeDesignation }}</h2>
    <h3>Logiciel : {{ version()?.softwareName }}</h3>
    <p>Sorti le : {{ version()?.publicationDate }}</p>

  </app-detail-page>

} @else {
  <span class="loading loading-ring loading-xl"></span>
  <span class="loading loading-ring loading-xl"></span>
  <span class="loading loading-ring loading-xl"></span>
}

<app-generic-form-page
  [title]="versionEdit() ? 'Modifier la version de logiciel' : 'Créer la version de logiciel'"
  [loading]="loading()"
  [error]="error()"
  [submitLabel]="versionEdit() ? 'Modifier' : 'Créer'"
  (submitForm)="onSubmit()"
  [formGroup]="form"
  [routeId] = "routeId()"
  [isEditMode] = "isEditMode()"
>

  <!-- champs -->

  <app-field-text labelKey="Numéro de version" placeholder="1.0.0"
                  [control]="form.controls.versionNumber"
                  [errorMessages]="{
    required: 'Le numéro est obligatoire',
    maxlength: 'Max 127 caractères'}">
  </app-field-text>

  <app-field-select
    labelKey="Type de version"
    [control]="form.controls.idVersionType"
    [options]="listVersionType()"
    valueField="idVersionType"
    labelField="designation"
    placeholder="Choisir un type"
    [errorMessages]="{
    required: 'Le type est obligatoire'
  }"
  />

  <app-field-select
    labelKey="Logiciel"
    [control]="form.controls.idSoftware"
    [options]="listSoftware()"
    valueField="idSoftware"
    labelField="name"
    placeholder="Choisir un logiciel"
    [errorMessages]="{
    required: 'Le logiciel est obligatoire'
  }"
  />

  <app-field-text type="date" labelKey="Date de publication"
                  [control]="form.controls.publicationDate"
                  [errorMessages]="{
    required: 'Entrez une date',
    validDate: 'Le format de la date est invalide'}">
  </app-field-text>

</app-generic-form-page>

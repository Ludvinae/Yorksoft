<div class="container">
  <div class="login">
    <H1>YorkSoft</H1>
    <H2>Connectez-vous au portail employé</H2>
    <form autocomplete="on">
      <fieldset class="fieldset bg-base-200 border-base-300 rounded-box w-xs border p-4" >
        <legend class="fieldset-legend">Login</legend>

        <label class="label" for="email">Email</label>
        <input type="email" class="input" placeholder="Email" id="email" name="email"/>

        <label class="label" for="password">Password</label>
        <input type="password" class="input" placeholder="Password" id="password" name="password"/>

        <button class="btn btn-neutral mt-4" (click)="login()">Login</button>
      </fieldset>
    </form>

  </div>
</div>

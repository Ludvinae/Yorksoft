
@if (ticket()) {
  <app-detail-page [loading]="loading()" [error]="error()" [title]="label()"
                   [updateRoute]="updateRoute">

    <h2 class="text-2xl font-bold">{{ ticket()?.title }} {{ ticket()?.currentStatus }}</h2>
    <h3>Logiciel : {{ ticket()?.currentTheme }}</h3>
    <p>Sorti le : {{ ticket()?.modificationDate }}</p>

  </app-detail-page>

} @else {
  <span class="loading loading-ring loading-xl"></span>
  <span class="loading loading-ring loading-xl"></span>
  <span class="loading loading-ring loading-xl"></span>
}

<app-title title="Tickets" route="ticket"></app-title>

<app-generic-list
  [data]="ticketList()"
  [columns]="[{ label: 'Titre du ticket', field: 'title' },
              { label: 'Thématique', field: 'currentTheme'},
              { label: 'Dernière modification', field: 'modificationDate'},
              { label: 'Logiciel', field: 'softwareName'},
              { label: 'Version', field: 'versionNumber'},
              { label: 'Type de version', field: 'versionTypeDesignation'},
              { label: 'Statut', field: 'currentStatus'},
              { label: 'Priorité', field: 'currentPriority'}]"
  [baseRoute]="'/ticket'"
  [idField]="'idTicket'"
  [itemTemplate]="ticketCard"
  (deleteItem)="onDelete($event)">
</app-generic-list>

<ng-template #ticketCard let-ticket >
  <div>
    <span>{{ ticket.currentStatus }} {{ ticket.currentPriority }}</span>
    <span>{{ ticket.modificationDate }}</span>
  </div>
  <div>
    <h3 class="font-bold text-lg">{{ ticket.title }}</h3>
  </div>
  <div>
    <span>{{ ticket.softwareName }} {{ ticket.versionNumber}} {{ ticket.versionTypeDesignation }}</span>
    <span>{{ ticket.currentTheme }}</span>
  </div>
</ng-template>
